<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="計算はつながって動く。記憶は合図で変わる。"><title>計算はつながって動く。記憶は合図で変わる。</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7654b5"/></marker></defs><rect width="920" height="480" rx="18" fill="#f5f2fc"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" fill="#34364d"><text x="28" y="40" font-size="25">計算はつながって動く。記憶は合図で変わる。</text><rect x="30" y="75" width="175" height="105" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="46" y="107" font-size="20">A = 3</text><text x="46" y="135" font-size="20">B = 5</text><path d="M208 126 L278 126" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="75" width="240" height="105" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="301" y="107" font-size="20">always @*</text><text x="301" y="135" font-size="20">加算の答え = 8</text><path d="M530 126 L610 126" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="618" y="75" width="270" height="105" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="634" y="107" font-size="20">posedge clk</text><text x="634" y="135" font-size="20">step=1 の READで</text><text x="634" y="163" font-size="20">Vに8を保存</text><text x="35" y="229" font-size="20">合図の前：答えが8でも、Vはまだ前の値。</text><path d="M50 300 H200 V260 H350 V300 H500 V260 H650 V300 H850" fill="none" stroke="#7654b5" stroke-width="4"/><text x="45" y="340" font-size="20">clk</text><path d="M200 402 L200 270" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 402 L500 270" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><text x="110" y="438" font-size="20">0 → 1 の合図</text><text x="460" y="438" font-size="20">ここでも合図</text></g></svg>