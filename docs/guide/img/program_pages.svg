<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="ページ番号とページ内番地で、命令の場所を選ぶ"><title>ページ番号とページ内番地で、命令の場所を選ぶ</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7654b5"/></marker></defs><rect width="920" height="440" rx="18" fill="#f5f2fc"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" fill="#34364d"><text x="28" y="40" font-size="25">ページ番号とページ内番地で、命令の場所を選ぶ</text><rect x="45" y="82" width="345" height="87" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="61" y="114" font-size="20">ページ番号：8bit</text><text x="61" y="142" font-size="20">2</text><rect x="450" y="82" width="420" height="87" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="466" y="114" font-size="20">ページ内番地：8bit</text><text x="466" y="142" font-size="20">40</text><text x="405" y="136" font-size="25">＋</text><path d="M220 176 L370 225" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 176 L540 225" fill="none" stroke="#7654b5" stroke-width="3" marker-end="url(#arrow)"/><rect x="220" y="235" width="480" height="80" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="236" y="267" font-size="20">全体の番地 = 2 × 256 + 40 = 552</text><text x="45" y="360" font-size="20">順に進む：ページ2・255番地 → ページ3・0番地</text><text x="45" y="407" font-size="20">ジャンプ：予約したページと番地を、同じ合図で切り替える</text></g></svg>