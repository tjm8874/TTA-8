<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="Verilog：ビットを選ぶ／箱をならべる"><title>Verilog：ビットを選ぶ／箱をならべる</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7654b5"/></marker></defs><rect width="920" height="480" rx="18" fill="#f5f2fc"/><g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" fill="#34364d"><text x="28" y="40" font-size="25">Verilog：ビットを選ぶ／箱をならべる</text><text x="30" y="85" font-size="23">reg [7:0] v;  →  8マスで一つの数</text><rect x="35" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="51" y="140" font-size="20">7</text><rect x="140" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="156" y="140" font-size="20">6</text><rect x="245" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="261" y="140" font-size="20">5</text><rect x="350" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="366" y="140" font-size="20">4</text><rect x="455" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="471" y="140" font-size="20">3</text><rect x="560" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="576" y="140" font-size="20">2</text><rect x="665" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="681" y="140" font-size="20">1</text><rect x="770" y="108" width="94" height="62" rx="10" fill="#e7ddfa" stroke="#b9acd8" stroke-width="2"/><text x="786" y="140" font-size="20">0</text><text x="35" y="204" font-size="20">v[7] は左はしの1bit。v[6:0] は残りの7bit。</text><text x="30" y="262" font-size="23">reg [7:0] ram [0:31];  →  8bitの箱が32個</text><rect x="35" y="289" width="130" height="83" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="51" y="321" font-size="20">ram[0]</text><text x="51" y="349" font-size="20">8bit</text><rect x="230" y="289" width="130" height="83" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="246" y="321" font-size="20">ram[1]</text><text x="246" y="349" font-size="20">8bit</text><rect x="425" y="289" width="130" height="83" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="441" y="321" font-size="20">ram[2]</text><text x="441" y="349" font-size="20">8bit</text><rect x="760" y="289" width="130" height="83" rx="10" fill="#ffffff" stroke="#b9acd8" stroke-width="2"/><text x="776" y="321" font-size="20">ram[31]</text><text x="776" y="349" font-size="20">8bit</text><text x="602" y="335" font-size="35">…</text><text x="35" y="422" font-size="20">[7:0] は各箱の幅。 [0:31] は箱の番号。</text></g></svg>